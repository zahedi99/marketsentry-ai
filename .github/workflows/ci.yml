# Runs the same checks as `make check` on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      # Real Postgres for the database tests (same version as infra/docker-compose.yml).
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marketsentry
          POSTGRES_PASSWORD: marketsentry
          POSTGRES_DB: marketsentry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketsentry"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://marketsentry:marketsentry@localhost:5432/marketsentry_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck (mypy, strict)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest
