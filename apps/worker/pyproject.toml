[project]
name = "worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "market-core",
    "data-sources",
    "briefing-agents",
    "ms-db",
    "python-dotenv>=1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
market-core = { workspace = true }
data-sources = { workspace = true }
briefing-agents = { workspace = true }
ms-db = { workspace = true }
