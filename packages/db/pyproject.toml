[project]
name = "ms-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "market-core",
    "psycopg[binary]>=3",
    "sqlalchemy>=2",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
market-core = { workspace = true }
